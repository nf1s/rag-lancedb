{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rag.fullname" . }}-auth
  labels:
    {{- include "rag.labels" . | nindent 4 }}
type: Opaque
stringData:
  BOOTSTRAP_ADMIN_USER: {{ .Values.auth.bootstrapAdmin.username | quote }}
  BOOTSTRAP_ADMIN_PASSWORD: {{ .Values.auth.bootstrapAdmin.password | quote }}
{{- end }}
