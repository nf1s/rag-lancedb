apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rag.fullname" . }}-api
  labels:
    {{- include "rag.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api
    spec:
      initContainers:
        - name: wait-for-store
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              for attempt in $(seq 1 60); do
                if wget -q -O- http://{{ include "rag.fullname" . }}-store:{{ .Values.store.port }}/healthz >/dev/null 2>&1; then
                  echo "store is ready"; exit 0
                fi
                echo "waiting for store (${attempt}/60)"; sleep 2
              done
              echo "store did not become ready in time" >&2; exit 1
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command:
            - uvicorn
            - api.main:app
            - --host=0.0.0.0
            - --port={{ .Values.api.port }}
            {{- if .Values.api.devReload }}
            - --reload
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          envFrom:
            - configMapRef:
                name: {{ include "rag.fullname" . }}-config
          env:
            - name: LLM_API_KEY
              {{- if .Values.llm.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.llm.existingSecret }}
                  key: apiKey
              {{- else }}
              value: {{ .Values.llm.apiKey | quote }}
              {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
