apiVersion: v1
kind: Service
metadata:
  name: {{ include "rag.fullname" . }}-ui
  labels:
    {{- include "rag.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ui
  ports:
    - name: http
      port: {{ .Values.ui.port }}
      targetPort: http
