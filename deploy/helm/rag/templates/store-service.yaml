apiVersion: v1
kind: Service
metadata:
  name: {{ include "rag.fullname" . }}-store
  labels:
    {{- include "rag.labels" . | nindent 4 }}
    app.kubernetes.io/component: store
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: store
  ports:
    - name: http
      port: {{ .Values.store.port }}
      targetPort: http
