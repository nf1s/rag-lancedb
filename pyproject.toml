[project]
name = "rag-lancedb"
version = "0.1.0"
description = "Local RAG pipeline on LanceDB, deployed to Colima Kubernetes with Skaffold"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "orjson>=3.10",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
store = [
    "lancedb>=0.41,<0.42",
    "pylance>=14.0.2",
    "pyarrow>=16",
]
api = [
    "fastembed>=0.9,<0.10",
]
ui = [
    "streamlit>=1.41",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["api", "common", "store"]
